<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Expense Tracker</h1>
</header>

<main>
    <section id="summary">
        <div class="summary-card">
            <span>Total Expenses</span>
            <strong id="total-all">₹0.00</strong>
        </div>
        <div class="summary-card">
            <span>This Month</span>
            <strong id="total-month">₹0.00</strong>
        </div>
        <div class="summary-card">
            <span>No. of Entries</span>
            <strong id="total-count">0</strong>
        </div>
    </section>

    <section id="form-section">
        <h2>Add Expense</h2>
        <form id="expense-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g. Grocery shopping" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">-- Select --</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Housing">Housing</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
            </div>
            <button type="submit">Add Expense</button>
        </form>
    </section>

    <section id="category-section">
        <h2>Spending by Category</h2>
        <div id="category-breakdown"></div>
    </section>

    <section id="list-section">
        <div class="list-header">
            <h2>All Expenses</h2>
            <div class="filters">
                <select id="filter-category">
                    <option value="All">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Housing">Housing</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Education">Education</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Other">Other</option>
                </select>
                <select id="filter-month">
                    <option value="All">All Months</option>
                </select>
                <button id="clear-all" class="danger">Clear All</button>
            </div>
        </div>

        <table id="expense-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="expense-list"></tbody>
        </table>
        <p id="empty-msg">No expenses recorded yet.</p>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
